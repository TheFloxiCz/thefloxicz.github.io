<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BCS Map Prices</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #080d14;
      --bg2:       #0d1520;
      --bg3:       #111d2e;
      --border:    #1a3050;
      --neon:      #00e5a0;
      --neon-dim:  #00a86b;
      --red:       #ff4060;
      --red-dim:   #c02040;
      --text:      #c8d8e8;
      --text-dim:  #607080;
      --mono:      'Share Tech Mono', monospace;
      --sans:      'Exo 2', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-weight: 300;
      min-height: 100vh;
    }

    /* NAV */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: 56px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-brand {
      font-family: var(--mono);
      font-size: .85rem;
      color: var(--neon);
      letter-spacing: .05em;
    }
    .nav-brand span { color: var(--text-dim); }

    /* HERO */
    .hero {
      padding: 3rem 2rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    .hero h1 {
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      font-weight: 700;
      line-height: 1.15;
      color: #fff;
    }
    .hero h1 em {
      font-style: normal;
      color: var(--neon);
    }
    .hero p {
      margin-top: .6rem;
      color: var(--text-dim);
      font-size: .9rem;
      font-family: var(--mono);
    }

    /* SEARCH */
    .search-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem 1.5rem;
    }
    .search-box {
      display: flex;
      align-items: center;
      gap: .75rem;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: .65rem 1rem;
      transition: border-color .2s;
    }
    .search-box:focus-within { border-color: var(--neon); }
    .search-box svg { flex-shrink: 0; color: var(--text-dim); }
    .search-box input {
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--sans);
      font-size: .95rem;
      width: 100%;
    }
    .search-box input::placeholder { color: var(--text-dim); }

    /* STATS BAR */
    .stats-bar {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem 1.5rem;
      display: flex;
      gap: 2rem;
      font-family: var(--mono);
      font-size: .8rem;
      color: var(--text-dim);
    }
    .stats-bar strong { color: var(--neon); }

    /* GRID */
    .grid-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem 4rem;
    }
    .map-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
    }
    .map-card {
      background: var(--bg2);
      padding: 1.1rem 1.25rem;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: background .15s;
      position: relative;
    }
    .map-card:hover { background: var(--bg3); }
    .map-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 2px;
      background: var(--neon);
      opacity: 0;
      transition: opacity .15s;
    }
    .map-card:hover::before { opacity: 1; }

    .map-name {
      font-size: .95rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: .35rem;
    }
    .map-price {
      font-family: var(--mono);
      font-size: 1.15rem;
      color: var(--neon);
    }
    .map-price span {
      font-size: .75rem;
      color: var(--text-dim);
      margin-left: .25rem;
    }

    /* EMPTY / LOADING */
    .state-msg {
      grid-column: 1/-1;
      padding: 3rem;
      text-align: center;
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: .85rem;
    }

    /* SCANLINE overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,.04) 2px,
        rgba(0,0,0,.04) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-brand">BCS<span>/</span>MAP-PRICES</div>
  <div style="font-family:var(--mono);font-size:.75rem;color:var(--text-dim)" id="last-update"></div>
</nav>

<div class="hero">
  <h1>Bus Company Simulator<br><em>Map Price Tracker</em></h1>
  <p id="hero-sub">Načítám data...</p>
</div>

<div class="search-wrap">
  <div class="search-box">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" id="search" placeholder="Hledat mapu...">
  </div>
</div>

<div class="stats-bar">
  <div>Map: <strong id="stat-total">—</strong></div>
  <div>Nejlevnější: <strong id="stat-min">—</strong></div>
  <div>Nejdražší: <strong id="stat-max">—</strong></div>
</div>

<div class="grid-wrap">
  <div class="map-grid" id="map-grid">
    <div class="state-msg">Načítám mapy...</div>
  </div>
</div>

<script>
  const BASE = './data/';
  let allMaps = [];

  async function load() {
    try {
      const res = await fetch(BASE + 'index.json');
      const data = await res.json();

      allMaps = Object.entries(data).map(([id, info]) => ({
        id, name: info.name, current: info.current
      })).sort((a, b) => a.name.localeCompare(b.name));

      // Stats
      const prices = allMaps.map(m => m.current);
      const minM = allMaps.reduce((a, b) => a.current < b.current ? a : b);
      const maxM = allMaps.reduce((a, b) => a.current > b.current ? a : b);

      document.getElementById('stat-total').textContent = allMaps.length;
      document.getElementById('stat-min').textContent = `${minM.name} — ${fmt(minM.current)}`;
      document.getElementById('stat-max').textContent = `${maxM.name} — ${fmt(maxM.current)}`;
      document.getElementById('hero-sub').textContent = `${allMaps.length} map · aktualizováno denně`;
      document.getElementById('last-update').textContent = new Date().toLocaleDateString('cs-CZ');

      render(allMaps);
    } catch(e) {
      document.getElementById('map-grid').innerHTML = '<div class="state-msg">Chyba při načítání dat.</div>';
    }
  }

  function fmt(price) {
    return price.toLocaleString('cs-CZ') + ' €';
  }

  function render(maps) {
    const grid = document.getElementById('map-grid');
    if (!maps.length) {
      grid.innerHTML = '<div class="state-msg">Žádná mapa nenalezena.</div>';
      return;
    }
    grid.innerHTML = maps.map(m => `
      <a class="map-card" href="map.html?id=${encodeURIComponent(m.id)}">
        <div class="map-name">${m.name}</div>
        <div class="map-price">${fmt(m.current)}<span>aktuální cena</span></div>
      </a>
    `).join('');
  }

  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    render(allMaps.filter(m => m.name.toLowerCase().includes(q)));
  });

  load();
</script>
</body>
</html>
