<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BCS Map Prices</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #080d14;
      --bg2:      #0d1520;
      --bg3:      #111d2e;
      --border:   #1a3050;
      --neon:     #00e5a0;
      --red:      #ff4060;
      --text:     #c8d8e8;
      --text-dim: #8aa8c0;
      --mono:     'Share Tech Mono', monospace;
      --sans:     'Exo 2', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); font-weight: 400; min-height: 100vh; }

    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2rem; height: 56px;
      background: var(--bg2); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .nav-brand { font-family: var(--mono); font-size: .85rem; color: var(--neon); letter-spacing: .05em; }
    .nav-brand span { color: var(--text-dim); }

    .hero { padding: 3rem 2rem 2rem; max-width: 1200px; margin: 0 auto; }
    .hero h1 { font-size: clamp(1.6rem, 4vw, 2.6rem); font-weight: 700; line-height: 1.15; color: #fff; }
    .hero h1 em { font-style: normal; color: var(--neon); }
    .hero p { margin-top: .6rem; color: var(--text-dim); font-size: .9rem; font-family: var(--mono); }

    .controls {
      max-width: 1200px; margin: 0 auto;
      padding: 0 2rem 1.5rem;
      display: flex; gap: .75rem; align-items: center; flex-wrap: wrap;
    }
    .search-box {
      flex: 1; min-width: 200px;
      display: flex; align-items: center; gap: .75rem;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 4px; padding: .65rem 1rem; transition: border-color .2s;
    }
    .search-box:focus-within { border-color: var(--neon); }
    .search-box svg { flex-shrink: 0; color: var(--text-dim); }
    .search-box input {
      background: none; border: none; outline: none;
      color: var(--text); font-family: var(--sans); font-size: .95rem; width: 100%;
    }
    .search-box input::placeholder { color: var(--text-dim); }

    .sort-select {
      background: var(--bg2); border: 1px solid var(--border);
      color: var(--text); font-family: var(--mono); font-size: .78rem;
      padding: .65rem .9rem; border-radius: 4px; cursor: pointer;
      outline: none; transition: border-color .2s;
    }
    .sort-select:focus, .sort-select:hover { border-color: var(--neon); }

    .stats-bar {
      max-width: 1200px; margin: 0 auto; padding: 0 2rem 1.5rem;
      display: flex; gap: 2rem; font-family: var(--mono); font-size: .8rem; color: var(--text-dim);
    }
    .stats-bar strong { color: var(--neon); }

    .grid-wrap { max-width: 1200px; margin: 0 auto; padding: 0 2rem 4rem; }
    .map-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px; background: var(--border); border: 1px solid var(--border);
    }
    .map-card {
      background: var(--bg2); padding: 1.1rem 1.25rem;
      cursor: pointer; text-decoration: none; color: inherit;
      display: flex; flex-direction: column; align-items: center; text-align: center;
      transition: background .15s; position: relative;
    }
    .map-card:hover { background: var(--bg3); }
    .map-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0;
      width: 2px; background: var(--neon); opacity: 0; transition: opacity .15s;
    }
    .map-card:hover::before { opacity: 1; }

    .map-name {
      font-size: .95rem; font-weight: 600; color: #fff;
      width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: .5rem;
    }
    .map-price {
      font-family: var(--mono); font-size: 1.2rem; color: var(--neon);
      margin-bottom: .35rem;
    }
    .trend {
      font-size: 1.3rem; line-height: 1;
    }
    .trend.up2   { color: #ff4060; }
    .trend.up1   { color: #ff9040; }
    .trend.flat  { color: #8aa8c0; }
    .trend.down1 { color: #80e0a0; }
    .trend.down2 { color: #00e5a0; }

    .state-msg {
      grid-column: 1/-1; padding: 3rem; text-align: center;
      color: var(--text-dim); font-family: var(--mono); font-size: .85rem;
    }

    body::after {
      content: ''; position: fixed; inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.04) 2px, rgba(0,0,0,.04) 4px);
      pointer-events: none; z-index: 9999;
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-brand">BCS<span>/</span>MAP-PRICES</div>
  <div style="font-family:var(--mono);font-size:.75rem;color:var(--text-dim)" id="last-update"></div>
</nav>

<div class="hero">
  <h1>Bus Company Simulator<br><em>Map Price Tracker</em></h1>
  <p id="hero-sub">Loading data...</p>
</div>

<div class="controls">
  <div class="search-box">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" id="search" placeholder="Search maps...">
  </div>
  <select class="sort-select" id="sort">
    <option value="az">Name (A–Z)</option>
    <option value="za">Name (Z–A)</option>
    <option value="asc">Price (low–high)</option>
    <option value="desc">Price (high–low)</option>
  </select>
</div>

<div class="stats-bar">
  <div>Maps: <strong id="stat-total">—</strong></div>
  <div>Cheapest: <strong id="stat-min">—</strong></div>
  <div>Most expensive: <strong id="stat-max">—</strong></div>
</div>

<div class="grid-wrap">
  <div class="map-grid" id="map-grid">
    <div class="state-msg">Loading maps...</div>
  </div>
</div>

<script>
  const BASE = './data/';
  let allMaps = [];
  let query = '';
  let sortKey = 'az';

  async function load() {
    try {
      const res = await fetch(BASE + 'index.json');
      const data = await res.json();

      allMaps = Object.entries(data).map(([id, info]) => ({ id, name: info.name, current: info.current, avg_7d: info.avg_7d ?? null }));

      const minM = allMaps.reduce((a, b) => a.current < b.current ? a : b);
      const maxM = allMaps.reduce((a, b) => a.current > b.current ? a : b);

      document.getElementById('stat-total').textContent = allMaps.length;
      document.getElementById('stat-min').textContent = `${minM.name} — ${fmt(minM.current)}`;
      document.getElementById('stat-max').textContent = `${maxM.name} — ${fmt(maxM.current)}`;
      document.getElementById('hero-sub').textContent = `${allMaps.length} maps · updated daily`;
      document.getElementById('last-update').textContent = new Date().toLocaleDateString('en-GB');

      renderFiltered();
    } catch(e) {
      document.getElementById('map-grid').innerHTML = '<div class="state-msg">Failed to load data.</div>';
    }
  }

  function fmt(price) {
    return price.toLocaleString('cs-CZ') + ' €';
  }

  function sorted(maps) {
    return [...maps].sort((a, b) => {
      if (sortKey === 'az')   return a.name.localeCompare(b.name);
      if (sortKey === 'za')   return b.name.localeCompare(a.name);
      if (sortKey === 'asc')  return a.current - b.current;
      if (sortKey === 'desc') return b.current - a.current;
    });
  }

  function renderFiltered() {
    const filtered = allMaps.filter(m => m.name.toLowerCase().includes(query));
    render(sorted(filtered));
  }

  function trend(current, avg_7d) {
    if (avg_7d === null) return '';
    const pct = (current - avg_7d) / avg_7d * 100;
    if (pct > 25)  return '<span class="trend up2">⭡</span>';
    if (pct > 5)   return '<span class="trend up1">↗</span>';
    if (pct >= -5) return '<span class="trend flat">—</span>';
    if (pct >= -25)return '<span class="trend down1">↘</span>';
    return '<span class="trend down2">⭣</span>';
  }

  function render(maps) {
    const grid = document.getElementById('map-grid');
    if (!maps.length) {
      grid.innerHTML = '<div class="state-msg">No maps found.</div>';
      return;
    }
    grid.innerHTML = maps.map(m => `
      <a class="map-card" href="map.html?id=${encodeURIComponent(m.id)}">
        <div class="map-name">${m.name}</div>
        <div class="map-price">${fmt(m.current)}</div>
        ${trend(m.current, m.avg_7d)}
      </a>
    `).join('');
  }

  document.getElementById('search').addEventListener('input', e => {
    query = e.target.value.toLowerCase();
    renderFiltered();
  });

  document.getElementById('sort').addEventListener('change', e => {
    sortKey = e.target.value;
    renderFiltered();
  });

  load();
</script>
</body>
</html>
