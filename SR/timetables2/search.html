<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SimRail – Connection Search</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0f2f5; --card-bg: #ffffff; --text: #1a1a2e; --text-muted: #6b7280;
  --primary: #1d6fa4; --primary-light: #e8f4fd; --border: #e5e7eb;
  --shadow: rgba(0,0,0,0.06); --input-bg: #ffffff;
  --result-bg: #ffffff; --result-border: #e5e7eb;
  --badge-passenger-bg: #0011FF; --badge-passenger-fg: #ffffff;
  --badge-freight-bg: #FF9EF6; --badge-freight-fg: #000000;
  --badge-other-bg: #555555; --badge-other-fg: #ffffff;
  --transfer-color: #f59e0b;
}
[data-theme="dark"] {
  --bg: #0d1117; --card-bg: #161b22; --text: #e6edf3; --text-muted: #8b949e;
  --primary: #58a6ff; --primary-light: #1a2333; --border: #30363d;
  --shadow: rgba(0,0,0,0.4); --input-bg: #0d1117;
  --result-bg: #161b22; --result-border: #30363d;
}
* { font-family: 'Barlow Semi Condensed', sans-serif; box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px 20px; transition: background 0.2s, color 0.2s; }
.container { max-width: 860px; margin: 0 auto; }

/* TOP BAR */
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; padding-bottom: 18px; border-bottom: 2px solid var(--border); }
h1 { font-size: 32px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; }
h1 span { color: var(--primary); }
.btn-theme { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; transition: all 0.2s; }
.btn-theme:hover { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }

/* BACK LINK */
.back-link { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: #ffffff; background: #2c3e50; padding: 8px 18px; border-radius: 50px; font-weight: 600; font-size: 15px; margin-bottom: 20px; transition: background 0.2s; }
.back-link:hover { background: #34495e; }

/* SEARCH CARD */
.search-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 28px; box-shadow: 0 2px 12px var(--shadow); margin-bottom: 24px; }
.search-card h2 { font-size: 20px; font-weight: 700; margin-bottom: 20px; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.form-row-options { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; margin-bottom: 20px; }

.field { display: flex; flex-direction: column; gap: 5px; position: relative; }
.field label { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); }

input[type="text"], input[type="time"] {
  background: var(--input-bg); border: 1.5px solid var(--border); color: var(--text);
  padding: 10px 14px; border-radius: 8px; font-size: 15px; font-family: inherit;
  outline: none; transition: border-color 0.2s, box-shadow 0.2s; width: 100%;
}
input[type="text"]:focus, input[type="time"]:focus {
  border-color: var(--primary); box-shadow: 0 0 0 3px rgba(29,111,164,0.12);
}

/* AUTOCOMPLETE */
.autocomplete-list {
  position: absolute; top: 100%; left: 0; right: 0; z-index: 100;
  background: var(--card-bg); border: 1.5px solid var(--primary); border-top: none;
  border-radius: 0 0 8px 8px; max-height: 220px; overflow-y: auto;
  box-shadow: 0 4px 16px var(--shadow); display: none;
}
.autocomplete-list.open { display: block; }
.autocomplete-item {
  padding: 8px 14px; cursor: pointer; font-size: 14px; transition: background 0.1s;
}
.autocomplete-item:hover, .autocomplete-item.active { background: var(--primary-light); color: var(--primary); }

/* CHECKBOXES */
.checkbox-group { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 15px; font-weight: 600; user-select: none; }
.checkbox-group input[type="checkbox"] { width: 17px; height: 17px; cursor: pointer; accent-color: var(--primary); }

/* TRANSFERS */
.field-transfers { display: flex; flex-direction: column; gap: 5px; }
.field-transfers label { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); }
.field-transfers select {
  background: var(--input-bg); border: 1.5px solid var(--border); color: var(--text);
  padding: 8px 12px; border-radius: 8px; font-size: 15px; font-family: inherit;
  outline: none; transition: border-color 0.2s; cursor: pointer;
}
.field-transfers select:focus { border-color: var(--primary); }

/* SEARCH BUTTON */
.btn-search {
  background: var(--primary); color: #fff; border: none; padding: 12px 32px;
  border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer;
  transition: opacity 0.2s; width: 100%;
}
.btn-search:hover { opacity: 0.88; }
.btn-search:disabled { opacity: 0.5; cursor: not-allowed; }

/* RESULTS */
.results-header { font-size: 18px; font-weight: 700; margin-bottom: 14px; color: var(--text-muted); }
.result-card {
  background: var(--result-bg); border: 1px solid var(--result-border);
  border-radius: 10px; padding: 16px 20px; margin-bottom: 10px;
  box-shadow: 0 1px 6px var(--shadow); transition: border-color 0.2s;
}
.result-card:hover { border-color: var(--primary); }

/* Hlavička karty */
.result-header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.result-trains { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.train-chip {
  display: flex; align-items: center; gap: 6px;
  background: var(--primary-light); border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 12px;
}
.train-chip-no { font-size: 20px; font-weight: 700; }
.cat-badge {
  display: inline-block; padding: 2px 8px; border-radius: 4px;
  font-weight: 700; font-size: 12px;
}
.result-time { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.result-time .arr { color: var(--text-muted); }
.result-duration { font-size: 13px; color: var(--text-muted); font-weight: 600; white-space: nowrap; }
.result-transfers-badge {
  font-size: 12px; color: var(--transfer-color); font-weight: 700;
  border: 1px solid var(--transfer-color); border-radius: 4px; padding: 1px 6px; white-space: nowrap;
}
.result-divider { color: var(--border); font-size: 18px; }

/* Tlačítka dřívější/pozdější */
.nav-results { display: flex; gap: 10px; margin-bottom: 12px; }
.btn-nav {
  background: var(--card-bg); border: 1px solid var(--border); color: var(--text);
  padding: 7px 16px; border-radius: 8px; font-size: 13px; font-weight: 700;
  cursor: pointer; font-family: inherit; transition: all 0.2s; flex: 1; text-align: center;
}
.btn-nav:hover { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }

/* Přestup mezi vlaky */
.transfer-block {
  display: flex; align-items: center; gap: 8px; margin: 4px 0;
  padding: 6px 10px; background: rgba(245,158,11,0.08);
  border-left: 3px solid var(--transfer-color); border-radius: 0 6px 6px 0;
}
.transfer-block-text { font-size: 13px; color: var(--transfer-color); font-weight: 700; }
.transfer-block-times { font-size: 12px; color: var(--text-muted); font-weight: 600; }

/* Zastávky */
.result-stops { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); display: none; }
.result-stops.open { display: block; }
.leg-header {
  font-size: 15px; font-weight: 700; margin: 10px 0 5px 0; padding-bottom: 4px;
  border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px;
}
.leg-header-dest { font-size: 13px; color: var(--text-muted); font-weight: 600; }
.stops-hidden-block { margin: 2px 0; }
.stops-hidden-toggle {
  background: none; border: 1px dashed var(--border); color: var(--text-muted);
  font-size: 12px; cursor: pointer; font-family: inherit; font-weight: 600;
  padding: 3px 10px; border-radius: 4px; width: 100%; text-align: left;
  transition: background 0.15s;
}
.stops-hidden-toggle:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
.stops-hidden-list { display: none; }
.stops-hidden-list.open { display: block; }
.stops-hidden-list .stop-row { font-style: italic; color: var(--text-muted); }
.stops-hidden-list .stop-time { color: var(--text-muted); }
.stop-row { display: flex; gap: 12px; font-size: 13px; padding: 2px 0; align-items: baseline; }
.stop-row.stop-key { font-weight: 700; }
.stop-time { font-variant-numeric: tabular-nums; min-width: 90px; color: var(--text-muted); font-weight: 600; }
.stop-name { flex: 1; }
.badge-ph { background: #1e7e34; color: white; padding: 1px 3px; font-size: 10px; border-radius: 2px; margin-left: 4px; font-weight: 700; }
.badge-pt { background: #ffc107; color: black; padding: 1px 4px; font-size: 10px; border-radius: 2px; margin-left: 4px; font-weight: 700; }
.btn-toggle { background: none; border: none; color: var(--primary); font-size: 13px; cursor: pointer; font-family: inherit; font-weight: 600; padding: 0; margin-top: 8px; }
.btn-toggle:hover { text-decoration: underline; }

.no-results { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 16px; }
.loading { text-align: center; padding: 20px; color: var(--text-muted); font-size: 15px; }
.error-msg { background: #ffe5e5; border-left: 4px solid #c0392b; color: #8b0000; padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; font-weight: 600; }

/* FOOTER */
footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border); text-align: center; font-size: 13px; color: var(--text-muted); }
footer a { color: var(--primary); text-decoration: none; font-weight: 600; }

@media (max-width: 600px) {
  .form-grid { grid-template-columns: 1fr; }
  .form-row { grid-template-columns: 1fr 1fr; }
  h1 { font-size: 24px; }
}
</style>
</head>
<body>
<div class="container">

  <div class="top-bar">
    <h1>SimRail <span>Connections</span></h1>
    <button class="btn-theme" id="theme-toggle">🌙 Dark Mode</button>
  </div>

  <a href="https://thefloxicz.github.io/SR/timetables/" class="back-link">
    ← Back to Timetables
  </a>

  <div class="search-card">
    <h2>🔍 Find Connection</h2>

    <div class="form-grid">
      <div class="field" id="wrap-from">
        <label>From</label>
        <input type="text" id="inp-from" placeholder="Departure station..." autocomplete="off">
        <div class="autocomplete-list" id="ac-from"></div>
      </div>
      <div class="field" id="wrap-to">
        <label>To</label>
        <input type="text" id="inp-to" placeholder="Arrival station..." autocomplete="off">
        <div class="autocomplete-list" id="ac-to"></div>
      </div>
    </div>

    <div class="form-row">
      <div class="field" id="wrap-via">
        <label>Via (optional)</label>
        <input type="text" id="inp-via" placeholder="Intermediate station..." autocomplete="off">
        <div class="autocomplete-list" id="ac-via"></div>
      </div>
      <div class="field">
        <label>Departure from</label>
        <input type="time" id="inp-time">
      </div>
      <div class="field-transfers">
        <label>Max transfers</label>
        <select id="inp-transfers">
          <option value="0">Direct only</option>
          <option value="1">Max 1</option>
          <option value="2" selected>Max 2</option>

        </select>
      </div>
    </div>

    <div class="form-row-options">
      <label class="checkbox-group">
        <input type="checkbox" id="chk-passenger" checked>
        Passenger trains
      </label>
      <label class="checkbox-group">
        <input type="checkbox" id="chk-freight" checked>
        Freight &amp; other trains
      </label>
    </div>

    <button class="btn-search" id="btn-search">Search</button>
  </div>

  <div id="results-area"></div>

</div>

<footer>
  &copy; 2026 <strong>TheFloxiCz</strong> &nbsp;·&nbsp; SimRail Connection Search
</footer>

<script>
// ─── CONFIG ──────────────────────────────────────────────────────────────────
const SEARCH_JSON_URL = "search.json"; // relativní cesta ke search.json
const MAX_RESULTS = 5;
const MIN_TRANSFER_WAIT = 3; // minimální čekání na přestup v minutách

const TYPE_STYLES = {
  "ECE":{"bg":"#3AFFFB","fg":"#000000"}, "ECJ":{"bg":"#3AFFFB","fg":"#000000"},
  "EIE":{"bg":"#0011FF","fg":"#FFFFFF"}, "EIJ":{"bg":"#0011FF","fg":"#FFFFFF"},
  "MPE":{"bg":"#0094FF","fg":"#FFFFFF"}, "MPJ":{"bg":"#0094FF","fg":"#FFFFFF"},
  "MHE":{"bg":"#000000","fg":"#FFFFFF"}, "MHJ":{"bg":"#000000","fg":"#FFFFFF"},
  "MOE":{"bg":"#4CFF00","fg":"#000000"}, "MOJ":{"bg":"#4CFF00","fg":"#000000"},
  "RPJ":{"bg":"#007F0E","fg":"#FFFFFF"}, "RPP":{"bg":"#007F0E","fg":"#FFFFFF"},
  "ROJ":{"bg":"#D9FF99","fg":"#000000"}, "ROE":{"bg":"#D9FF99","fg":"#000000"},
  "RAJ":{"bg":"#606060","fg":"#FFFFFF"},
  "PWE":{"bg":"#FFE0C6","fg":"#000000"}, "PWJ":{"bg":"#FFE0C6","fg":"#000000"},
  "TGE":{"bg":"#FF0000","fg":"#FFFFFF"},
  "TRE":{"bg":"#FF6A00","fg":"#000000"},
  "TDE":{"bg":"#FF9EF6","fg":"#000000"},
  "TME":{"bg":"#008080","fg":"#FFFFFF"},
  "TNE":{"bg":"#FF7F7F","fg":"#000000"},
  "TKE":{"bg":"#FFFF00","fg":"#000000"}, "TKP":{"bg":"#FFFF00","fg":"#000000"},
  "LPE":{"bg":"#E649FF","fg":"#FFFFFF"},
  "LTE":{"bg":"#B200FF","fg":"#FFFFFF"},
  "ZNE":{"bg":"#808080","fg":"#FFFFFF"},
  "ZUE":{"bg":"#808080","fg":"#FFFFFF"},
  "TSE":{"bg":"#FF2B1C","fg":"#FFFFFF"},
};

// ─── STATE ───────────────────────────────────────────────────────────────────
let allTrains = [];
let stations = [];
let dataLoaded = false;
let lastSearchParams = null; // pro dřívější/pozdější

// ─── DATA LOADING ─────────────────────────────────────────────────────────────
async function loadData() {
  try {
    const t0 = performance.now();
    const res = await fetch(SEARCH_JSON_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    allTrains = await res.json();
    console.log(`[Search] Načtení JSON: ${(performance.now()-t0).toFixed(0)} ms, ${allTrains.length} vlaků`);
    // Sestav seznam unikátních stanic ze zastávek
    const stationSet = new Set();
    for (const train of allTrains) {
      for (const stop of train.stops) {
        if (!stop.p) stationSet.add(stop.s); // jen neplynové
      }
    }
    stations = Array.from(stationSet).sort();
    dataLoaded = true;
    document.getElementById("btn-search").disabled = false;
  } catch (e) {
    document.getElementById("results-area").innerHTML =
      `<div class="error-msg">⚠️ Could not load search.json: ${e.message}. Make sure the file exists next to this HTML.</div>`;
  }
}

// ─── TIME UTILS ──────────────────────────────────────────────────────────────
function toMins(hhmm) {
  if (!hhmm) return null;
  const [h, m] = hhmm.split(":").map(Number);
  return h * 60 + m;
}
function fromMins(mins) {
  // wraps > 24h
  const m = ((mins % 1440) + 1440) % 1440;
  return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
}
function diffMins(a, b) {
  // b - a, handles midnight wrap (max 23h59)
  let d = b - a;
  if (d < 0) d += 1440;
  return d;
}
function formatDuration(mins) {
  const h = Math.floor(mins / 60), m = mins % 60;
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

// ─── STOP INDEX ──────────────────────────────────────────────────────────────
function stopIndex(train, station) {
  return train.stops.findIndex(s => s.s === station);
}
function stopDep(stop) { return stop.d || stop.a; }
function stopArr(stop) { return stop.a || stop.d; }

// ─── SEARCH ──────────────────────────────────────────────────────────────────
function search(depTimeOverride) {
  if (!dataLoaded) return;

  const from   = document.getElementById("inp-from").value.trim();
  const to     = document.getElementById("inp-to").value.trim();
  const via    = document.getElementById("inp-via").value.trim();
  const timeStr = document.getElementById("inp-time").value || "00:00";
  const maxTransfers = parseInt(document.getElementById("inp-transfers").value, 10);
  const wantPassenger = document.getElementById("chk-passenger").checked;
  const wantFreight   = document.getElementById("chk-freight").checked;

  if (!from || !to) { showError("Please fill in From and To fields."); return; }
  if (from === to)  { showError("From and To must be different stations."); return; }

  const t1 = performance.now();
  const depTime = depTimeOverride !== undefined ? depTimeOverride : toMins(timeStr);
  lastSearchParams = { from, to, via, maxTransfers, wantPassenger, wantFreight, baseTime: toMins(timeStr) };

  const allowed = t => t.category === "passenger" ? wantPassenger : wantFreight;
  const eligible = allTrains.filter(allowed);

  // Index: stanice → [{train, idx}] — jen zastávky kde vlak stojí (ne průjezd)
  const stationIndex = new Map();
  for (const train of eligible) {
    for (let i = 0; i < train.stops.length; i++) {
      if (train.stops[i].p) continue;
      const st = train.stops[i].s;
      if (!stationIndex.has(st)) stationIndex.set(st, []);
      stationIndex.get(st).push({ train, idx: i });
    }
  }

  const results = [];

  // ── PŘÍMÉ SPOJE ──
  const fromEntries = stationIndex.get(from) || [];
  for (const { train, idx: iFrom } of fromEntries) {
    const iTo = train.stops.findIndex((s, i) => i > iFrom && s.s === to && !s.p);
    if (iTo === -1) continue;

    if (via) {
      const iVia = train.stops.findIndex((s, i) => i > iFrom && i < iTo && s.s === via);
      if (iVia === -1) continue;
    }

    const dep = toMins(stopDep(train.stops[iFrom]));
    const arr = toMins(stopArr(train.stops[iTo]));
    if (dep === null || arr === null) continue;
    if (diffMins(depTime, dep) > 1439) continue;

    results.push({ legs: [{ train, from: iFrom, to: iTo }], dep, arr, duration: diffMins(dep, arr), transfers: 0 });
  }

  // ── PŘESTUPNÍ SPOJE ──
  if (maxTransfers > 0) {
    for (const { train: t1t, idx: iFrom1 } of fromEntries) {
      const dep1 = toMins(stopDep(t1t.stops[iFrom1]));
      if (dep1 === null || diffMins(depTime, dep1) > 1439) continue;

      for (let iMid = iFrom1 + 1; iMid < t1t.stops.length; iMid++) {
        const midStop = t1t.stops[iMid];
        if (midStop.p || midStop.s === to) continue;
        // Přestupní stanice musí být před cílem v tomto vlaku
        const iToInT1 = t1t.stops.findIndex((s, i) => i > iFrom1 && s.s === to && !s.p);
        if (iToInT1 !== -1 && iMid >= iToInT1) continue; // přestup je za cílem nebo přímo v cíli
        if (iToInT1 !== -1) continue; // vlak jede přímo do cíle — přestup zbytečný
        const arr1 = toMins(stopArr(midStop));
        if (arr1 === null) continue;

        const midEntries = stationIndex.get(midStop.s) || [];
        for (const { train: t2t, idx: iFrom2 } of midEntries) {
          if (t2t.no === t1t.no) continue;

          const dep2 = toMins(stopDep(t2t.stops[iFrom2]));
          if (dep2 === null) continue;
          const wait = diffMins(arr1, dep2);
          if (wait < MIN_TRANSFER_WAIT || wait > 180) continue;

          const iTo2 = t2t.stops.findIndex((s, i) => i > iFrom2 && s.s === to && !s.p);
          if (iTo2 === -1) continue;
          const arr2 = toMins(stopArr(t2t.stops[iTo2]));
          if (arr2 === null) continue;

          if (via) {
            const inL1 = t1t.stops.findIndex((s, i) => i > iFrom1 && i < iMid && s.s === via) !== -1;
            const inL2 = t2t.stops.findIndex((s, i) => i > iFrom2 && i <= iTo2 && s.s === via) !== -1;
            if (!inL1 && !inL2) continue;
          }

          results.push({
            legs: [{ train: t1t, from: iFrom1, to: iMid }, { train: t2t, from: iFrom2, to: iTo2 }],
            dep: dep1, arr: arr2, duration: diffMins(dep1, arr2), transfers: 1,
          });

          // ── DVA PŘESTUPY ──
          if (maxTransfers >= 2) {
            for (let iMid2 = iFrom2 + 1; iMid2 < t2t.stops.length; iMid2++) {
              const midStop2 = t2t.stops[iMid2];
              if (midStop2.p || midStop2.s === to) continue;
              // Pokud vlak č. 2 pokračuje až do cíle, třetí vlak není potřeba
              const t2GoesToDest = t2t.stops.findIndex((s, i) => i > iMid2 && s.s === to && !s.p) !== -1;
              if (t2GoesToDest) continue;
              const arr2m = toMins(stopArr(midStop2));
              if (arr2m === null) continue;

              const mid2Entries = stationIndex.get(midStop2.s) || [];
              for (const { train: t3t, idx: iFrom3 } of mid2Entries) {
                if (t3t.no === t1t.no || t3t.no === t2t.no) continue;
                const dep3 = toMins(stopDep(t3t.stops[iFrom3]));
                if (dep3 === null) continue;
                const wait2 = diffMins(arr2m, dep3);
                if (wait2 < MIN_TRANSFER_WAIT || wait2 > 180) continue;

                const iTo3 = t3t.stops.findIndex((s, i) => i > iFrom3 && s.s === to && !s.p);
                if (iTo3 === -1) continue;
                const arr3 = toMins(stopArr(t3t.stops[iTo3]));
                if (arr3 === null) continue;

                if (via) {
                  const inL1 = t1t.stops.findIndex((s, i) => i > iFrom1 && i < iMid && s.s === via) !== -1;
                  const inL2 = t2t.stops.findIndex((s, i) => i > iFrom2 && i < iMid2 && s.s === via) !== -1;
                  const inL3 = t3t.stops.findIndex((s, i) => i > iFrom3 && i <= iTo3 && s.s === via) !== -1;
                  if (!inL1 && !inL2 && !inL3) continue;
                }

                results.push({
                  legs: [
                    { train: t1t, from: iFrom1, to: iMid },
                    { train: t2t, from: iFrom2, to: iMid2 },
                    { train: t3t, from: iFrom3, to: iTo3 },
                  ],
                  dep: dep1, arr: arr3, duration: diffMins(dep1, arr3), transfers: 2,
                });
              }
            }
          }
        }
      }
    }
  }

  // ── SORT + DEDUPLICATE + LIMIT ──
  results.sort((a, b) => {
    const da = diffMins(depTime, a.dep);
    const db = diffMins(depTime, b.dep);
    if (da !== db) return da - db;
    if (a.transfers !== b.transfers) return a.transfers - b.transfers;
    return a.duration - b.duration;
  });

  const seen = new Set();
  const all = results.filter(r => {
    const key = r.legs.map(l => `${l.train.no}:${l.from}-${l.to}`).join("|");
    if (seen.has(key)) return false;
    seen.add(key); return true;
  }).slice(0, MAX_RESULTS);

  console.log(`[Search] Vyhledávání: ${(performance.now()-t1).toFixed(0)} ms, nalezeno ${all.length} spojení`);
  renderResults(all, from, to);
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function badgeHTML(type) {
  const s = TYPE_STYLES[type] || { bg: "#555", fg: "#fff" };
  return `<span class="cat-badge" style="background:${s.bg};color:${s.fg}">${type}</span>`;
}

function stopBadge(stop) {
  if (stop.st === "ph") return '<span class="badge-ph">PH</span>';
  if (stop.st === "pt") return '<span class="badge-pt">PT</span>';
  return "";
}

function trainDest(train) {
  // Konečná = poslední zastávka vlaku v datech
  const last = train.stops[train.stops.length - 1];
  return last ? last.s : "";
}

function buildStopsHTML(leg, r, li) {
  const allStops = leg.train.stops;
  const iFrom = leg.from;
  const iTo   = leg.to;

  // Zastávky před výchozí stanicí (schované)
  const before = allStops.slice(0, iFrom); // nezobrazujeme vůbec
  // Zastávky na trase
  const route  = allStops.slice(iFrom, iTo + 1);
  // Zastávky za cílovou stanicí (schované)
  const after  = allStops.slice(iTo + 1);

  let html = "";

  // Hlavička úseku v detailu — větší, s konečnou
  const dest = trainDest(leg.train);
  html += `<div class="leg-header">${badgeHTML(leg.train.type)} <strong>${leg.train.no}</strong> <span class="leg-header-dest">→ ${dest}</span></div>`;

  // Skryté zastávky před
  if (before.length > 0) {
    const uid = `bef-${li}-${Math.random().toString(36).slice(2)}`;
    html += `<div class="stops-hidden-block">
      <button class="stops-hidden-toggle" onclick="toggleHidden('${uid}')">▶ ${before.length} stop${before.length > 1 ? "s" : ""} before ${allStops[iFrom].s}</button>
      <div class="stops-hidden-list" id="${uid}">`;
    before.forEach(stop => {
      const t = stopDep(stop) || stopArr(stop) || "—";
      html += `<div class="stop-row"><div class="stop-time">${t}</div><div class="stop-name">${stop.s}${stopBadge(stop)}</div></div>`;
    });
    html += `</div></div>`;
  }

  // Zastávky na trase
  route.forEach((stop, si) => {
    const isKey = si === 0 || si === route.length - 1;
    const dep = stopDep(stop), arr = stopArr(stop);
    const timeStr = dep && arr && dep !== arr ? `${arr} / ${dep}` : (dep || arr || "—");
    html += `<div class="stop-row${isKey ? " stop-key" : ""}"><div class="stop-time">${timeStr}</div><div class="stop-name">${stop.s}${stopBadge(stop)}</div></div>`;
  });

  // Skryté zastávky za
  if (after.length > 0) {
    const uid = `aft-${li}-${Math.random().toString(36).slice(2)}`;
    html += `<div class="stops-hidden-block">
      <button class="stops-hidden-toggle" onclick="toggleHidden('${uid}')">▶ ${after.length} stop${after.length > 1 ? "s" : ""} after ${allStops[iTo].s}</button>
      <div class="stops-hidden-list" id="${uid}">`;
    after.forEach(stop => {
      const t = stopDep(stop) || stopArr(stop) || "—";
      html += `<div class="stop-row"><div class="stop-time">${t}</div><div class="stop-name">${stop.s}${stopBadge(stop)}</div></div>`;
    });
    html += `</div></div>`;
  }

  // Přestup za tímto úsekem
  if (li < r.legs.length - 1) {
    const arrT    = fromMins(toMins(stopArr(leg.train.stops[iTo])));
    const nextLeg = r.legs[li + 1];
    const nextDep = fromMins(toMins(stopDep(nextLeg.train.stops[nextLeg.from])));
    const waitMin = diffMins(toMins(stopArr(leg.train.stops[iTo])), toMins(stopDep(nextLeg.train.stops[nextLeg.from])));
    html += `<div class="transfer-block">
      <div>
        <div class="transfer-block-text">⇄ Transfer at ${leg.train.stops[iTo].s}</div>
        <div class="transfer-block-times">Arrival ${arrT} · Departure ${nextDep} · Wait ${formatDuration(waitMin)}</div>
      </div>
    </div>`;
  }

  return html;
}

function searchEarlier() {
  if (!lastSearchParams) return;
  // Vezmi čas prvního zobrazeného výsledku a odečti 1 minutu
  const firstCard = document.querySelector(".result-card");
  if (!firstCard) return;
  const timeEl = firstCard.querySelector(".result-time");
  if (!timeEl) return;
  const depText = timeEl.childNodes[0].textContent.trim();
  const depMins = toMins(depText);
  if (depMins === null) return;
  // Hledej 5 spojení která odjíždějí těsně před tímto časem
  // Spustíme search s upraveným časem = depMins - 1, ale výsledky obrátíme
  runSearchWithTime(depMins - 1, true);
}

function searchLater() {
  if (!lastSearchParams) return;
  // Vezmi čas posledního zobrazeného výsledku + 1 min
  const cards = document.querySelectorAll(".result-card");
  if (!cards.length) return;
  const lastCard = cards[cards.length - 1];
  const timeEl = lastCard.querySelector(".result-time");
  if (!timeEl) return;
  const depText = timeEl.childNodes[0].textContent.trim();
  const depMins = toMins(depText);
  if (depMins === null) return;
  runSearchWithTime(depMins + 1, false);
}

function runSearchWithTime(depTime, earlier) {
  // Dočasně nastav čas v inputu
  document.getElementById("inp-time").value = fromMins(depTime);
  if (earlier) {
    // Pro "dřívější" hledáme od depTime dozadu — najdeme víc a bereme posledních 5
    search(depTime);
  } else {
    search(depTime);
  }
}

function toggleHidden(uid) {
  const el = document.getElementById(uid);
  const btn = el.previousElementSibling;
  const open = el.classList.toggle("open");
  const count = el.querySelectorAll(".stop-row").length;
  const label = btn.textContent.replace(/^[▶▼] /, "");
  btn.textContent = (open ? "▼ " : "▶ ") + label;
}

function renderResults(results, from, to) {
  const area = document.getElementById("results-area");
  if (results.length === 0) {
    area.innerHTML = `<div class="no-results">No connections found. Try adjusting the time or increasing transfers.</div>`;
    return;
  }

  area.innerHTML = `
    <div class="nav-results">
      <button class="btn-nav" onclick="searchEarlier()">◀ Earlier connections</button>
      <button class="btn-nav" onclick="searchLater()">Later connections ▶</button>
    </div>
    <div class="results-header">Found ${results.length} connection${results.length > 1 ? "s" : ""}:</div>`;

  results.forEach((r, ri) => {
    const depStr = fromMins(r.dep);
    const arrStr = fromMins(r.arr);
    const card = document.createElement("div");
    card.className = "result-card";

    // Řádek vlaků — jen typ+číslo, bez konečné
    const trainsHTML = r.legs.map(leg => {
      const t = leg.train;
      return `<div class="train-chip">${badgeHTML(t.type)}<span class="train-chip-no">${t.no}</span></div>`;
    }).join(`<span style="color:var(--transfer-color);font-size:16px">⇄</span>`);

    card.innerHTML = `
      <div class="result-header">
        <div class="result-trains">${trainsHTML}</div>
        <span class="result-divider">|</span>
        <div class="result-time">${depStr} <span class="arr">→ ${arrStr}</span></div>
        <div class="result-duration">${formatDuration(r.duration)}</div>
        ${r.transfers > 0 ? `<div class="result-transfers-badge">${r.transfers} transfer${r.transfers > 1 ? "s" : ""}</div>` : ""}
      </div>
      <button class="btn-toggle" data-ri="${ri}">▼ Show stops</button>
      <div class="result-stops" id="stops-${ri}"></div>
    `;

    card.querySelector(".btn-toggle").addEventListener("click", function() {
      const panel = document.getElementById(`stops-${ri}`);
      if (panel.classList.contains("open")) {
        panel.classList.remove("open");
        this.textContent = "▼ Show stops";
        return;
      }
      if (!panel._built) {
        panel.innerHTML = r.legs.map((leg, li) => buildStopsHTML(leg, r, li)).join("");
        panel._built = true;
      }
      panel.classList.add("open");
      this.textContent = "▲ Hide stops";
    });

    area.appendChild(card);
  });
}

function showError(msg) {
  document.getElementById("results-area").innerHTML = `<div class="error-msg">⚠️ ${msg}</div>`;
}

// ─── AUTOCOMPLETE ─────────────────────────────────────────────────────────────
function setupAutocomplete(inputId, listId) {
  const inp = document.getElementById(inputId);
  const list = document.getElementById(listId);
  let activeIdx = -1;

  inp.addEventListener("input", () => {
    const val = inp.value.trim().toLowerCase();
    if (!val || !dataLoaded) { list.classList.remove("open"); return; }
    const matches = stations.filter(s => s.toLowerCase().includes(val)).slice(0, 10);
    if (!matches.length) { list.classList.remove("open"); return; }
    activeIdx = -1;
    list.innerHTML = matches.map((s, i) =>
      `<div class="autocomplete-item" data-val="${s}">${s}</div>`
    ).join("");
    list.classList.add("open");
    list.querySelectorAll(".autocomplete-item").forEach(item => {
      item.addEventListener("mousedown", e => {
        inp.value = e.target.dataset.val;
        list.classList.remove("open");
      });
    });
  });

  inp.addEventListener("keydown", e => {
    const items = list.querySelectorAll(".autocomplete-item");
    if (!items.length) return;
    if (e.key === "ArrowDown") { activeIdx = Math.min(activeIdx + 1, items.length - 1); }
    else if (e.key === "ArrowUp") { activeIdx = Math.max(activeIdx - 1, 0); }
    else if (e.key === "Enter" && activeIdx >= 0) {
      inp.value = items[activeIdx].dataset.val;
      list.classList.remove("open");
      e.preventDefault();
    } else return;
    items.forEach((it, i) => it.classList.toggle("active", i === activeIdx));
    e.preventDefault();
  });

  inp.addEventListener("blur", () => setTimeout(() => list.classList.remove("open"), 150));
}

const applyTheme = dark => {
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  btn.textContent = dark ? "☀️ Light Mode" : "🌙 Dark Mode";
};
applyTheme(localStorage.getItem("theme") === "dark");
btn.onclick = () => {
  const isDark = document.documentElement.getAttribute("data-theme") === "dark";
  localStorage.setItem("theme", isDark ? "light" : "dark");
  applyTheme(!isDark);
};
